<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doge Village - Doge Well & Pool Queue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #2c3e50;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .game-container {
      width: 100%;
      max-width: 480px;
      background: #fff8e7;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border: 4px solid #d4a373;
    }

    .scene-box {
      position: relative;
      width: 100%;
      height: 320px;
      background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      border-bottom: 4px solid #d4a373;
    }

    .signboard {
      background: rgba(139, 69, 19, 0.9);
      color: #fffae6;
      padding: 8px 15px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      border: 2px dashed #ffd700;
      font-size: 14px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      align-self: center;
    }

    .well-action-area {
      text-align: center;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .well-btn {
      background: #f77f00;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 0px #d65f00;
      transition: all 0.1s ease;
    }

    .well-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0px #d65f00;
    }

    .chat-bubble {
      position: absolute;
      bottom: 110px;
      background: #fff;
      color: #333;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      animation: bounce 1.5s infinite;
      display: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .ui-panel {
      padding: 20px;
    }

    .stats-box {
      background: #fefae0;
      border: 2px solid #dda15e;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin-bottom: 15px;
    }

    .balance-val {
      font-size: 26px;
      font-weight: 800;
      color: #2b9348;
    }

    .queue-info {
      background: #faedcd;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      margin-bottom: 15px;
      border: 1px solid #ccd5ae;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      box-shadow: 0 4px 0px rgba(0,0,0,0.2);
    }

    .btn-pool { background: #d4a373; }
    .btn-withdraw { background: #283618; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- Village & Doge Well Visual Scene -->
    <div class="scene-box">
      <div class="signboard">🪵 Doge Well (Pool Queue)</div>
      
      <!-- Auto Waving Chat Bubble -->
      <div id="waveBubble" class="chat-bubble">👋 Aajaao yaar, pool mein 10x jeeto!</div>

      <div class="well-action-area">
        <button class="well-btn" onclick="mineDoge()">🪣 Draw from Well (+0.02 DOGE)</button>
      </div>
    </div>

    <!-- Stats & Controls -->
    <div class="ui-panel">
      <div class="stats-box">
        <div style="font-size: 11px; color: #666; text-transform: uppercase;">Your Balance</div>
        <div class="balance-val"><span id="balance">0.0000</span> DOGE</div>
        <div id="levelBadge" style="font-size: 12px; color: #bc6c25; font-weight: bold; margin-top: 3px;">🏠 Village Level 1</div>
      </div>

      <div class="queue-info">
        <b>🌊 Water Well Pool Queue:</b> <span id="poolCount">3</span> / 10 DOGE<br>
        <span style="font-size: 11px; color: #7f4f24;">Rule: 1 DOGE entry = 9 DOGE win chance!</span>
      </div>

      <div class="btn-group">
        <button class="btn btn-pool" onclick="joinPool()">🏊 Join Pool (1 DOGE)</button>
        <button class="btn btn-withdraw" onclick="openModal()">💸 Withdraw</button>
      </div>
    </div>
  </div>

  <!-- FaucetPay Modal -->
  <div id="withdrawModal" class="modal">
    <div class="modal-content">
      <h3>💸 FaucetPay Payout</h3>
      <input type="email" id="faucetEmail" placeholder="Enter FaucetPay Email">
      <button class="well-btn" style="width:100%; margin-top:5px;" onclick="submitWithdraw()">Submit Request</button>
      <button class="well-btn" style="width:100%; margin-top:5px; background:#bc4749;" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    let balance = parseFloat(localStorage.getItem('doge_balance')) || 0.0000;
    let level = parseInt(localStorage.getItem('doge_level')) || 1;
    let clicks = parseInt(localStorage.getItem('doge_clicks')) || 0;
    let poolCount = 3;

    updateUI();

    // Automatic Waving and Inviting Animation every 1 Minute (60,000 ms)
    setInterval(() => {
      const bubble = document.getElementById('waveBubble');
      bubble.style.display = 'block';
      setTimeout(() => {
        bubble.style.display = 'none';
      }, 5000); // Bubble stays for 5 seconds
    }, 60000);

    function updateUI() {
      document.getElementById('balance').innerText = balance.toFixed(4);
      document.getElementById('levelBadge').innerText = `🏠 Village Level ${level}`;
      document.getElementById('poolCount').innerText = poolCount;
    }

    function mineDoge() {
      balance += 0.0200;
      clicks++;

      if (clicks % 5 === 0) {
        level++;
      }

      localStorage.setItem('doge_balance', balance);
      localStorage.setItem('doge_level', level);
      localStorage.setItem('doge_clicks', clicks);
      updateUI();
    }

    function joinPool() {
      if (balance < 1.0000) {
        alert("⚠️ You need at least 1.00 DOGE to enter the Water Well Pool!");
        return;
      }
      balance -= 1.0000;
      poolCount++;
      if (poolCount >= 10) {
        alert("🎉 Pool Target Reached! #1 user won 9 DOGE, 1 DOGE re-invested!");
        poolCount = 1;
      }
      localStorage.setItem('doge_balance', balance);
      updateUI();
    }

    function openModal() { document.getElementById('withdrawModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('withdrawModal').style.display = 'none'; }

    function submitWithdraw() {
      const email = document.getElementById('faucetEmail').value;
      if (!email.includes('@')) {
        alert("Please enter valid email!");
        return;
      }
      if (balance < 2.0000) {
        alert("⚠️ Minimum withdrawal is 2.00 DOGE!");
        return;
      }
      alert(`🎉 Success! Withdrawal request sent to ${email}`);
      balance = 0;
      localStorage.setItem('doge_balance', balance);
      updateUI();
      closeModal();
    }
  </script>
</body>
</html>
