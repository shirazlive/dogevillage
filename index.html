<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doge Village - Doge Well & Pool Queue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #1e1b18;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      overflow-x: hidden;
    }

    .village-fullscreen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1600&auto=format&fit=crop') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    /* Top Village Header */
    .village-header {
      background: rgba(139, 69, 19, 0.85);
      border: 3px dashed #ffd700;
      padding: 10px 25px;
      border-radius: 15px;
      color: #fffae6;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .village-header h1 {
      font-size: 24px;
      font-weight: 800;
      text-shadow: 2px 2px #000;
    }

    /* Floating Chat Bubble for Waving */
    .wave-bubble {
      position: absolute;
      top: 30%;
      background: #fff;
      color: #333;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border: 2px solid #f77f00;
      animation: bounce 1.5s infinite;
      display: none;
      z-index: 10;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Bottom Control Dashboard Overlay */
    .dashboard-panel {
      background: rgba(255, 248, 231, 0.95);
      border: 4px solid #d4a373;
      border-radius: 25px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      margin-bottom: 10px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fefae0;
      border: 2px solid #dda15e;
      border-radius: 15px;
      padding: 12px 18px;
      margin-bottom: 12px;
    }

    .balance-val {
      font-size: 24px;
      font-weight: 800;
      color: #2b9348;
    }

    .queue-box {
      background: #faedcd;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 13px;
      margin-bottom: 15px;
      border: 1px solid #ccd5ae;
      text-align: center;
    }

    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      box-shadow: 0 4px 0px rgba(0,0,0,0.2);
      transition: all 0.1s ease;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0px rgba(0,0,0,0.2);
    }

    .btn-well { background: #f77f00; box-shadow: 0 4px 0px #d65f00; }
    .btn-pool { background: #d4a373; box-shadow: 0 4px 0px #b08968; }
    .btn-withdraw { background: #283618; box-shadow: 0 4px 0px #1e2612; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 20px;
      width: 90%;
      max-width: 350px;
      text-align: center;
      border: 3px solid #d4a373;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: 2px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="village-fullscreen">
    <!-- Header Board -->
    <div class="village-header">
      <h1>🪵 Doge Well Village</h1>
      <div style="font-size: 12px; color: #ffe6a7;">Pool • Play • Earn • Win</div>
    </div>

    <!-- Auto Waving Chat Bubble -->
    <div id="waveBubble" class="wave-bubble">👋 Aajaao yaar, pool mein 10x jeeto!</div>

    <!-- Bottom Interactive Dashboard -->
    <div class="dashboard-panel">
      <div class="stats-row">
        <div>
          <div style="font-size: 10px; color: #666; text-transform: uppercase; font-weight: bold;">Your Balance</div>
          <div class="balance-val"><span id="balance">0.0000</span> DOGE</div>
        </div>
        <div style="text-align: right;">
          <div id="levelBadge" style="font-size: 12px; color: #bc6c25; font-weight: bold;">🏠 Level 1</div>
          <div style="font-size: 11px; color: #777;">Active Miner</div>
        </div>
      </div>

      <div class="queue-box">
        <b>🌊 Water Well Pool Queue:</b> <span id="poolCount">3</span> / 10 DOGE<br>
        <span style="font-size: 11px; color: #7f4f24;">Rule: 1 DOGE entry = 9 DOGE win chance!</span>
      </div>

      <div class="btn-grid">
        <button class="btn btn-well" onclick="mineDoge()">🪣 Draw from Well (+0.02 DOGE)</button>
        <button class="btn btn-pool" onclick="joinPool()">🏊 Join Pool Queue (1 DOGE)</button>
        <button class="btn btn-withdraw" onclick="openModal()">💸 Withdraw to FaucetPay</button>
      </div>
    </div>
  </div>

  <!-- FaucetPay Modal -->
  <div id="withdrawModal" class="modal">
    <div class="modal-content">
      <h3 style="color: #283618; margin-bottom: 5px;">💸 FaucetPay Payout</h3>
      <p style="font-size: 12px; color: #666;">Enter your registered FaucetPay email.</p>
      <input type="email" id="faucetEmail" placeholder="example@gmail.com">
      <button class="btn btn-withdraw" onclick="submitWithdraw()">Submit Request</button>
      <button class="btn" style="background: #bc4749; margin-top: 8px;" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    let balance = parseFloat(localStorage.getItem('doge_balance')) || 0.0000;
    let level = parseInt(localStorage.getItem('doge_level')) || 1;
    let clicks = parseInt(localStorage.getItem('doge_clicks')) || 0;
    let poolCount = 3;

    updateUI();

    // Automatic Waving and Inviting Animation every 1 Minute
    setInterval(() => {
      const bubble = document.getElementById('waveBubble');
      bubble.style.display = 'block';
      setTimeout(() => {
        bubble.style.display = 'none';
      }, 5000);
    }, 60000);

    function updateUI() {
      document.getElementById('balance').innerText = balance.toFixed(4);
      document.getElementById('levelBadge').innerText = `🏠 Level ${level}`;
      document.getElementById('poolCount').innerText = poolCount;
    }

    function mineDoge() {
      balance += 0.0200;
      clicks++;

      if (clicks % 5 === 0) {
        level++;
      }

      localStorage.setItem('doge_balance', balance);
      localStorage.setItem('doge_level', level);
      localStorage.setItem('doge_clicks', clicks);
      updateUI();
    }

    function joinPool() {
      if (balance < 1.0000) {
        alert("⚠️ You need at least 1.00 DOGE to enter the Water Well Pool!");
        return;
      }
      balance -= 1.0000;
      poolCount++;
      if (poolCount >= 10) {
        alert("🎉 Pool Target Reached! #1 user won 9 DOGE, 1 DOGE re-invested!");
        poolCount = 1;
      }
      localStorage.setItem('doge_balance', balance);
      updateUI();
    }

    function openModal() { document.getElementById('withdrawModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('withdrawModal').style.display = 'none'; }

    function submitWithdraw() {
      const email = document.getElementById('faucetEmail').value;
      if (!email.includes('@')) {
        alert("Please enter valid email!");
        return;
      }
      if (balance < 2.0000) {
        alert("⚠️ Minimum withdrawal is 2.00 DOGE!");
        return;
      }
      alert(`🎉 Success! Withdrawal request sent to ${email}`);
      balance = 0;
      localStorage.setItem('doge_balance', balance);
      updateUI();
      closeModal();
    }
  </script>
</body>
</html>
