<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doge Village - Doge Well & Pool Queue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    /* Embedded HD Village View */
    .village-fullscreen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('village.png') no-repeat center center/cover,
                  url('https://lh3.googleusercontent.com/d/1000552249') no-repeat center center/cover,
                  #70c5ce;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
    }

    /* Auto Waving Chat Bubble (1 min interval) */
    .wave-bubble {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      border: 3px solid #f77f00;
      animation: pulseWave 1.5s infinite alternate;
      display: none;
      z-index: 10;
      text-align: center;
    }

    @keyframes pulseWave {
      0% { transform: translate(-50%, -50%) scale(0.95); }
      100% { transform: translate(-50%, -50%) scale(1.05); }
    }

    /* Clickable target over Doge Well in the image */
    .well-click-target {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 220px;
      cursor: pointer;
      z-index: 8;
      border-radius: 50%;
    }

    /* Dashboard Overlay at Bottom */
    .dashboard-panel {
      position: relative;
      z-index: 10;
      background: rgba(43, 29, 14, 0.88);
      border: 3px solid #dda15e;
      border-radius: 20px;
      padding: 14px 18px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      margin-bottom: 5px;
      color: #fff;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #dda15e;
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 10px;
    }

    .balance-val {
      font-size: 22px;
      font-weight: 800;
      color: #2ed573;
      text-shadow: 1px 1px 2px #000;
    }

    .queue-box {
      background: rgba(212, 163, 115, 0.25);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      margin-bottom: 10px;
      border: 1px solid #dda15e;
      text-align: center;
      color: #fffae6;
    }

    .btn-grid {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 11px 6px;
      font-size: 12px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      box-shadow: 0 4px 0px rgba(0,0,0,0.3);
      transition: all 0.1s ease;
      text-shadow: 1px 1px 1px #000;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0px rgba(0,0,0,0.3);
    }

    .btn-well { background: #e67e22; box-shadow: 0 3px 0px #d35400; }
    .btn-pool { background: #27ae60; box-shadow: 0 3px 0px #1e8449; }
    .btn-withdraw { background: #2980b9; box-shadow: 0 3px 0px #1c5980; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #2b1d0e;
      padding: 20px;
      border-radius: 18px;
      width: 90%;
      max-width: 330px;
      text-align: center;
      border: 3px solid #dda15e;
      color: #fff;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border: 2px solid #dda15e;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="village-fullscreen">

    <!-- Invisible Click Target over center Doge Well -->
    <div class="well-click-target" onclick="mineDoge()" title="Tap Doge Well to Draw DOGE!"></div>

    <!-- Auto Waving Chat Bubble (Every 1 Minute) -->
    <div id="waveBubble" class="wave-bubble">👋 Aajaao sab! Pool Queue mein 10x chance hai! 🌊</div>

    <!-- Bottom Dashboard Overlay -->
    <div class="dashboard-panel">
      <div class="stats-row">
        <div>
          <div style="font-size: 10px; color: #ccc; text-transform: uppercase; font-weight: bold;">Your Balance</div>
          <div class="balance-val"><span id="balance">0.0000</span> DOGE</div>
        </div>
        <div style="text-align: right;">
          <div id="levelBadge" style="font-size: 12px; color: #f39c12; font-weight: bold;">🏠 Level 1</div>
          <div style="font-size: 10px; color: #bbb;">Active Miner</div>
        </div>
      </div>

      <div class="queue-box">
        <b>🌊 Water Well Pool Queue:</b> <span id="poolCount">3</span> / 10 DOGE<br>
        <span style="font-size: 11px; color: #f1c40f;">1 DOGE Entry = 9 DOGE Win Chance!</span>
      </div>

      <div class="btn-grid">
        <button class="btn btn-well" onclick="mineDoge()">🪣 Draw (+0.02)</button>
        <button class="btn btn-pool" onclick="joinPool()">🏊 Join Pool (1 DOGE)</button>
        <button class="btn btn-withdraw" onclick="openModal()">💸 Withdraw</button>
      </div>
    </div>

  </div>

  <!-- FaucetPay Modal -->
  <div id="withdrawModal" class="modal">
    <div class="modal-content">
      <h3 style="color: #f39c12; margin-bottom: 5px;">💸 FaucetPay Payout</h3>
      <p style="font-size: 12px; color: #ccc;">Enter your registered FaucetPay email.</p>
      <input type="email" id="faucetEmail" placeholder="example@gmail.com">
      <button class="btn btn-pool" style="width:100%; margin-top: 5px;" onclick="submitWithdraw()">Submit Payout Request</button>
      <button class="btn" style="width:100%; background: #c0392b; margin-top: 8px;" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    let balance = parseFloat(localStorage.getItem('doge_balance')) || 0.0000;
    let level = parseInt(localStorage.getItem('doge_level')) || 1;
    let clicks = parseInt(localStorage.getItem('doge_clicks')) || 0;
    let poolCount = 3;

    updateUI();

    // Automatic Waving and Inviting Animation every 1 Minute (60,000 ms)
    setInterval(() => {
      const bubble = document.getElementById('waveBubble');
      bubble.style.display = 'block';
      setTimeout(() => {
        bubble.style.display = 'none';
      }, 6000);
    }, 60000);

    function updateUI() {
      document.getElementById('balance').innerText = balance.toFixed(4);
      document.getElementById('levelBadge').innerText = `🏠 Level ${level}`;
      document.getElementById('poolCount').innerText = poolCount;
    }

    function mineDoge() {
      balance += 0.0200;
      clicks++;

      if (clicks % 5 === 0) {
        level++;
      }

      localStorage.setItem('doge_balance', balance);
      localStorage.setItem('doge_level', level);
      localStorage.setItem('doge_clicks', clicks);
      updateUI();
    }

    function joinPool() {
      if (balance < 1.0000) {
        alert("⚠️ You need at least 1.00 DOGE to enter the Water Well Pool!");
        return;
      }
      balance -= 1.0000;
      poolCount++;
      if (poolCount >= 10) {
        alert("🎉 Pool Target Reached! #1 user won 9 DOGE, 1 DOGE re-invested!");
        poolCount = 1;
      }
      localStorage.setItem('doge_balance', balance);
      updateUI();
    }

    function openModal() { document.getElementById('withdrawModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('withdrawModal').style.display = 'none'; }

    function submitWithdraw() {
      const email = document.getElementById('faucetEmail').value;
      if (!email.includes('@')) {
        alert("Please enter valid email!");
        return;
      }
      if (balance < 2.0000) {
        alert("⚠️ Minimum withdrawal is 2.00 DOGE!");
        return;
      }
      alert(`🎉 Success! Withdrawal request sent to ${email}`);
      balance = 0;
      localStorage.setItem('doge_balance', balance);
      updateUI();
      closeModal();
    }
  </script>
</body>
</html>
